<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProEdit SMP - Kayıt & Giriş Portalı</title>

    <style>
        body {
            background: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }

        h2 { margin-bottom: 20px; color: #55ff55; }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .tab-btn.active {
            color: #55ff55;
            border-bottom: 2px solid #55ff55;
        }

        .form-group {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .form-group.active { display: flex; }

        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            outline: none;
        }

        input:focus { border-color: #55ff55; }

        button.submit-btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #55ff55;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.submit-btn:hover { background: #44cc44; }

        #msg {
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>ProEdit SMP</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('register')">Kayıt Ol</button>
        <button class="tab-btn" onclick="switchTab('login')">Giriş Yap</button>
    </div>

    <!-- KAYIT FORMU -->
    <div id="register-form" class="form-group active">
        <input type="text" id="reg-user" placeholder="Minecraft Kullanıcı Adı">
        <input type="password" id="reg-pass" placeholder="Şifre">
        <button class="submit-btn" onclick="register()">Kayıt Ol & 500k Kazan</button>
    </div>

    <!-- GİRİŞ FORMU -->
    <div id="login-form" class="form-group">
        <input type="text" id="log-user" placeholder="Kullanıcı Adı">
        <input type="password" id="log-pass" placeholder="Şifre">
        <button class="submit-btn" onclick="login()">Giriş Yap</button>
    </div>

    <div id="msg"></div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));

        if(tab === 'register') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('register-form').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('login-form').classList.add('active');
        }
        document.getElementById('msg').innerText = '';
    }

    async function register() {
        const username = document.getElementById('reg-user').value;
        const password = document.getElementById('reg-pass').value;
        const msg = document.getElementById('msg');

        msg.style.color = '#ffaa00';
        msg.innerText = 'Kayıt işleniyor...';

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        msg.style.color = res.ok ? '#55ff55' : '#ff5555';
        msg.innerText = data.message;
    }

    async function login() {
        const username = document.getElementById('log-user').value;
        const password = document.getElementById('log-pass').value;
        const msg = document.getElementById('msg');

        msg.style.color = '#ffaa00';
        msg.innerText = 'Giriş yapılıyor...';

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        msg.style.color = res.ok ? '#55ff55' : '#ff5555';
        msg.innerText = data.message;
    }
</script>

</body>
</html>
